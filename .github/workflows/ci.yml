name: CI

on:
  push:
    branches: [goverhub-mobile]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Sunucu — tür kontrolü ve testler (gerçek PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway database inside this CI job only; not a secret.
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://goverhub_app:ci-only@localhost:5432/goverhub_test
      TEST_DATABASE_OWNER_URL: postgres://goverhub_owner:ci-only@localhost:5432/goverhub_test
      TEST_RESTORE_DATABASE_URL: postgres://goverhub_app:ci-only@localhost:5432/goverhub_restore_test
      TEST_RESTORE_DATABASE_OWNER_URL: postgres://goverhub_owner:ci-only@localhost:5432/goverhub_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mobile/package-lock.json
      - name: PostgreSQL rolleri ve test veritabanları
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE goverhub_owner LOGIN PASSWORD 'ci-only'" \
            -c "CREATE ROLE goverhub_app LOGIN PASSWORD 'ci-only'" \
            -c "CREATE DATABASE goverhub_test OWNER goverhub_owner" \
            -c "CREATE DATABASE goverhub_restore_test OWNER goverhub_owner"
          psql -h localhost -U postgres -tAc "SHOW server_version"
          pg_dump --version
          pg_restore --version
      - name: Bağımlılıklar
        working-directory: server
        run: npm ci
      # Çevrimdışı eşitleme testi mobil uygulamanın kendi kuyruk motorunu içe aktarır;
      # mobil tsconfig'i expo/tsconfig.base'i genişlettiği için mobil bağımlılıklar da gerekir.
      - name: Mobil bağımlılıklar (çevrimdışı eşitleme testi için)
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Tür kontrolü
        working-directory: server
        run: npm run typecheck
      - name: Testler (birim + gerçek PostgreSQL ve HTTP entegrasyonu)
        working-directory: server
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Test sonuçları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/test-results.xml
          if-no-files-found: ignore

  mobile:
    name: Mobil — tür kontrolü ve web derlemesi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Bağımlılıklar
        working-directory: mobile
        run: npm ci
      - name: Tür kontrolü
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Web derlemesi
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://example.invalid/api
        run: npx expo export --platform web
      - name: Derleme özeti
        working-directory: mobile
        run: du -sh dist && ls dist | head

  local-demo:
    name: Yerel demo (Docker) — derleme, giriş, kalıcılık, kapı
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yerel-demo
    steps:
      - uses: actions/checkout@v4
      - name: Derle ve başlat (baslat.cmd ile aynı compose komutu)
        run: docker compose up -d --build --remove-orphans --wait --wait-timeout 300
      - name: Yalnızca 127.0.0.1:8080 yayınlanmış olmalı
        run: |
          docker compose ps --format '{{.Service}} {{.Publishers}}'
          pubs=$(docker compose ps --format json | python3 -c 'import json,sys; t=sys.stdin.read().strip(); rows=json.loads(t) if t.startswith("[") else [json.loads(l) for l in t.splitlines() if l.strip()]; print(" ".join(sorted({p["URL"]+":"+str(p["PublishedPort"]) for r in rows for p in (r.get("Publishers") or []) if p.get("PublishedPort")})))')
          echo "Yayınlanan: $pubs"
          [ "$pubs" = "127.0.0.1:8080" ] || { echo "::error::Beklenmeyen yayınlanmış port: $pubs"; exit 1; }
      - name: Demo girişi ve kayıt (localhost:8080 üzerinden)
        run: |
          set -eu
          B=http://127.0.0.1:8080/api; J='content-type: application/json'
          curl -fsS $B/env
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$J" -d '{"email":"kisi@gercek.com.tr"}' $B/auth/email/start)" = 422 ]
          curl -fsS -H "$J" -d '{"email":"sahip@demo.goverhub.test"}' $B/auth/email/start >/dev/null
          code=$(curl -fsS "$B/dev/outbox/latest?email=sahip@demo.goverhub.test" | grep -oE '[0-9]{6}' | head -1)
          tok=$(curl -fsS -H "$J" -d "{\"email\":\"sahip@demo.goverhub.test\",\"code\":\"$code\"}" $B/auth/email/verify | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -H "authorization: Bearer $tok" $B/companies | tee /tmp/companies.json | head -c 300; echo
          grep -q 'Kahve Durağı (DEMO)' /tmp/companies.json
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Durdur/başlat sonrası kayıtlar korunur, demo verisi tekrar yüklenmez
        run: |
          set -eu
          q() { docker compose exec -T db psql -U postgres -d goverhub_demo -tAc "SELECT (SELECT count(*) FROM companies)||'/'||(SELECT count(*) FROM tasks)||'/'||(SELECT count(*) FROM login_challenges)"; }
          before=$(q); echo "önce: $before"
          docker compose down
          docker compose up -d --remove-orphans --wait --wait-timeout 180
          after=$(q); echo "sonra: $after"
          [ "$before" = "$after" ] || { echo "::error::Kayıtlar değişti"; exit 1; }
          docker compose logs app | grep -q 'Demo verisi zaten yüklü'
      - name: Tünel kapısı (tünel açılmadan, iç ağdan)
        run: |
          set -eu
          docker compose --profile tunel up -d kapi
          docker compose --profile tunel exec -T kapi /etc/goverhub/ayarla.sh --yeni
          T=$(docker compose --profile tunel exec -T kapi cat /data/goverhub/erisim-anahtari)
          docker run --rm --network goverhub-demo_tunel -e T="$T" --entrypoint node goverhub-demo-app:yerel -e '
            const s = (u, o = {}) => fetch("http://kapi:8081" + u, { redirect: "manual", ...o }).then(r => r.status);
            (async () => {
              const r = { davetsiz: await s("/"), api: await s("/api/env"), yanlis: await s("/erisim/yanlis"), davet: await s("/erisim/" + process.env.T) };
              const net = require("net");
              const reach = (h, p) => new Promise(ok => { const c = net.connect({ host: h, port: p, timeout: 3000 }, () => { c.destroy(); ok(true); }); c.on("error", () => ok(false)); c.on("timeout", () => { c.destroy(); ok(false); }); });
              r.app3000 = await reach("app", 3000); r.db5432 = await reach("db", 5432); r.proxy8080 = await reach("proxy", 8080);
              console.log(JSON.stringify(r));
              const ok = r.davetsiz === 403 && r.api === 403 && r.yanlis === 403 && r.davet === 302 && !r.app3000 && !r.db5432 && !r.proxy8080;
              process.exit(ok ? 0 : 1);
            })();'
      - name: Sıfırlama (ayrı işlem) kayıtları siler
        run: |
          docker compose --profile tunel down -v --remove-orphans
          [ -z "$(docker volume ls -q --filter name=goverhub-demo_)" ] || { docker volume ls; exit 1; }
      - name: Hata durumunda kayıtlar
        if: failure()
        run: docker compose --profile tunel logs --tail 80
